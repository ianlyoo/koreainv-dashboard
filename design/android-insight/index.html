<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Android 종목 인사이트 · 디자인 검토</title><link rel="stylesheet" href="style.css"></head><body><aside class="review"><div class="review-title">ANDROID / DESIGN REVIEW <span>04</span></div><h1>종목을 읽는 흐름,<br>차트에서 시작합니다.</h1><p>디자인 시안 · 예시 데이터 · 실제 연결 없음</p><div class="controls"><label>화면<select id="screen"><option value="insight">종목 인사이트</option><option value="holding">보유 종목 상세</option><option value="settings">설정</option><option value="connection">SaveTicker 연결 설정</option></select></label><label>데이터 상태<select id="state"><option value="normal">정상</option><option value="disconnected">미연결</option><option value="partial">부분 성공</option><option value="expired">연결 만료</option><option value="offline">오프라인</option></select></label><button id="theme">라이트 모드 보기</button><button id="overview" aria-pressed="false">전체 화면 길이로 보기</button></div><div class="review-notes"><h2>검토할 흐름</h2><ol><li>보유 상세 → 종목 인사이트 → 뒤로</li><li>기간·캔들/라인 변경과 가격 선택</li><li>섹션 이동 → 차트 → 전체 수치 펼치기</li><li>만료 상태 → 연결 다시 확인</li></ol><p>412 × 892 Android 화면 기준<br>20dp 여백 · 48dp 터치 영역</p><p>연결 및 보안 저장은 제안된 제품 동작입니다. 이 시안에는 인증·저장·외부 통신이 없습니다.</p></div></aside><main class="stage"><div class="device" data-theme="dark"><div class="statusbar" aria-hidden="true"><b>9:41</b><span>▴ ▰ ▰</span></div><div id="app" class="app"></div><div class="systembar" aria-hidden="true"><span></span></div><div id="toast" role="status"></div></div></main><script src="app.js"></script></body></html>
